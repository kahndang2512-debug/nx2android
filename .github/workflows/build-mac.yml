name: Build and Capture Shaders on macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup .NET and Dependencies
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore prod.keys
        run: |
          mkdir -p ~/.switch
          echo "${{ secrets.PROD_KEYS }}" > ~/.switch/prod.keys

      - name: Setup and Download ROMs
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown

          mkdir -p game_input
          echo "Dang tai toan bo file ROM tu Google Drive..."
          python3 -m gdown --folder "https://drive.google.com/drive/folders/1CZRqalhkkgWDzJL-wkJRhc7FwzWM6zXK" -O game_input/
          
          echo "Danh sach cac file da tai ve:"
          ls -la game_input/

      - name: Run Shader Capture & Port Step
        run: |
          echo "=== Cai dat requirements cua repo ==="
          python3 -m pip install -r requirements.txt

          echo "=== Kiem tra huong dan lenh porter ==="
          python3 -m porter.cli --help || python3 -m porter --help

          echo "=== Chay tien trinh port cho thu muc game_input ==="
          # Chay pipeline voi game da tai ve
          python3 -m porter.cli --input game_input/ || python3 ./packaging/nx2android.py --help

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-port-output
          path: output/
