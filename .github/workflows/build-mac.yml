name: Build and Capture Shaders on macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup .NET and Dependencies
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore prod.keys
        run: |
          mkdir -p ~/.switch
          echo "${{ secrets.PROD_KEYS }}" > ~/.switch/prod.keys

      - name: Setup and Download ROMs
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install gdown

          mkdir -p game_input
          echo "Dang tai toan bo file ROM tu Google Drive..."
          python3 -m gdown --folder "https://drive.google.com/drive/folders/1CZRqalhkkgWDzJL-wkJRhc7FwzWM6zXK" -O game_input/
          
          # Tim va dua tat ca file NSP/XCI ra truc tiep thu muc game_input
          find game_input -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" \) -exec mv {} game_input/ \;
          
          echo "=== Danh sach file ROM san sang de port ==="
          ls -lh game_input/

      - name: Run Shader Capture & Port Step
        run: |
          echo "=== Kiem tra toolchain va cau hinh ==="
          python3 -m porter doctor || true

          echo "=== Bat dau qua trinh Port game ==="
          # Chay lenh port chinh thuc voi thu muc chua game
          python3 -m porter port game_input/

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-port-output
          path: |
            output/
            build/
            dist/
            *.apk
