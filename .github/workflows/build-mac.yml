name: Build and Capture Shaders on macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup .NET and Dependencies
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Android NDK r27c
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Restore prod.keys
        run: |
          mkdir -p ~/.switch
          echo "${{ secrets.PROD_KEYS }}" > ~/.switch/prod.keys
          echo "${{ secrets.PROD_KEYS }}" > ./prod.keys

      - name: Setup and Download ROMs
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install gdown

          mkdir -p game_input
          echo "Dang tai toan bo file ROM tu Google Drive..."
          python3 -m gdown --folder "https://drive.google.com/drive/folders/1CZRqalhkkgWDzJL-wkJRhc7FwzWM6zXK" -O game_input/
          
          # Dua tat ca file ROM ra truc tiep thu muc game_input
          find game_input -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" \) -exec mv {} game_input/ \;
          
          echo "=== Danh sach file ROM san sang ==="
          ls -lh game_input/

      - name: Run Shader Capture & Port Step
        run: |
          # Set prod.keys
          python3 -m porter config keys ~/.switch/prod.keys

          echo "=== Kiem tra toolchain (bo qua loi exit code neu co warning) ==="
          python3 -m porter doctor || true

          echo "=== Kiem tra cac tuy chon cua lenh port ==="
          python3 -m porter port --help || true

          echo "=== Bat dau qua trinh Port game ==="
          mkdir -p output
          python3 -m porter port game_input/ --experimental -o output/ || python3 -m porter port game_input/ -o output/ || python3 -m porter port game_input/

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-port-output
          path: |
            output/
            game_input/*.apk
            game_input/build/
            build/
            dist/
            *.apk
